name: Build and Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Cross-Compile & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v6

      - name: Setup Go Environment
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Run Vet & Race Detector Unit/Integration Tests
        run: |
          go vet ./...
          go test -race -v -count=1 ./...

      - name: Run Automated Enterprise Self-Test
        run: go run ./cmd/openfir -mode selftest

      - name: Cross-Compile Compliant Release Archives for All Platforms
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -e
          mkdir -p dist
          build_pkg() {
            local os=$1 arch=$2 ext=$3
            local name="openfir_${VERSION}_${os}_${arch}"
            local stage="dist/${name}"
            mkdir -p "${stage}"
            CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" go build \
              -trimpath -ldflags="-s -w" \
              -o "${stage}/openfir${ext}" ./cmd/openfir
            cp LICENSE NOTICE THIRD_PARTY_LICENSES.md README.md "${stage}/"
            if [ "${os}" = "windows" ]; then
              (cd dist && zip -qr "${name}.zip" "${name}")
            else
              tar -C dist -czf "dist/${name}.tar.gz" "${name}"
            fi
            rm -rf "${stage}"
          }

          build_pkg linux   amd64 ""
          build_pkg linux   arm64 ""
          build_pkg windows amd64 ".exe"
          build_pkg windows arm64 ".exe"
          build_pkg darwin  amd64 ""
          build_pkg darwin  arm64 ""

          (cd dist && sha256sum openfir_* > SHA256SUMS.txt)

      - name: Attach Release Archives & Checksums to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/openfir_*.tar.gz
            dist/openfir_*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: false
