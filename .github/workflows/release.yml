# SPDX-License-Identifier: Apache-2.0
name: Build and Release OpenFIR (CLI + All-Platform Native Clients)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cli-matrix:
    name: Pure-Go CLI Matrix (Linux / Windows / macOS × amd64 / arm64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Run Vet, Race Detector Tests & Enterprise Self-Test
        run: |
          go vet ./...
          go test -race -count=1 ./...
          go run ./cmd/openfir -mode selftest
      - name: Cross-Compile 6 Compliant Standalone CLI Archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -e
          mkdir -p release-assets
          build_cli() {
            local os=$1 arch=$2 ext=$3
            local name="openfir_${VERSION}_${os}_${arch}"
            local stage="release-assets/${name}"
            mkdir -p "${stage}"
            CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" go build \
              -trimpath -ldflags="-s -w" \
              -o "${stage}/openfir${ext}" ./cmd/openfir
            cp LICENSE NOTICE THIRD_PARTY_LICENSES.md README.md "${stage}/"
            if [ "${os}" = "windows" ]; then
              (cd release-assets && zip -qr "${name}.zip" "${name}")
            else
              tar -C release-assets -czf "release-assets/${name}.tar.gz" "${name}"
            fi
            rm -rf "${stage}"
          }
          build_cli linux   amd64 ""
          build_cli linux   arm64 ""
          build_cli windows amd64 ".exe"
          build_cli windows arm64 ".exe"
          build_cli darwin  amd64 ""
          build_cli darwin  arm64 ""
          ls -lh release-assets/
      - uses: actions/upload-artifact@v4
        with:
          name: release-cli-archives
          path: release-assets/

  gui-linux-x86_64:
    name: Linux x86_64 (C11 Frosted TUI + C++20 X11 GUI + Core)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Install System X11/Xft Headers & Clang
        run: sudo apt-get update && sudo apt-get install -y build-essential clang libx11-dev libxft-dev libfontconfig1-dev pkg-config
      - name: Build, Smoke-Test & Package Linux x86_64 Desktop + TUI Bundle
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -e
          clang -x c -fsyntax-only -Wall -Wextra -Werror include/openfir.h
          mkdir -p dist release-assets
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/openfir ./cmd/openfir
          CGO_ENABLED=1 go build -trimpath -buildmode=c-shared \
            -ldflags="-s -w -extldflags=-Wl,-soname,libopenfir_core.so" \
            -o dist/libopenfir_core.so ./cmd/openfir-cabi
          make -C apps/linux-tui test
          make -C apps/linux-gui test
          local_name="openfir-desktop-tui_${VERSION}_linux_amd64"
          stage="release-assets/${local_name}"
          mkdir -p "${stage}"
          cp dist/openfir dist/openfir-tui dist/openfir-gui dist/libopenfir_core.so include/openfir.h LICENSE NOTICE THIRD_PARTY_LICENSES.md README.md "${stage}/"
          tar -C release-assets -czf "release-assets/${local_name}.tar.gz" "${local_name}"
          rm -rf "${stage}"
          ls -lh release-assets/
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-amd64-gui
          path: release-assets/*.tar.gz

  gui-linux-arm64:
    name: Linux ARM64 (C11 Frosted TUI + C++20 X11 GUI + Core)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Install System X11/Xft Headers
        run: sudo apt-get update && sudo apt-get install -y build-essential libx11-dev libxft-dev libfontconfig1-dev pkg-config
      - name: Build, Smoke-Test & Package Linux ARM64 Desktop + TUI Bundle
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -e
          mkdir -p dist release-assets
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/openfir ./cmd/openfir
          CGO_ENABLED=1 go build -trimpath -buildmode=c-shared \
            -ldflags="-s -w -extldflags=-Wl,-soname,libopenfir_core.so" \
            -o dist/libopenfir_core.so ./cmd/openfir-cabi
          make -C apps/linux-tui test
          make -C apps/linux-gui test
          local_name="openfir-desktop-tui_${VERSION}_linux_arm64"
          stage="release-assets/${local_name}"
          mkdir -p "${stage}"
          cp dist/openfir dist/openfir-tui dist/openfir-gui dist/libopenfir_core.so include/openfir.h LICENSE NOTICE THIRD_PARTY_LICENSES.md README.md "${stage}/"
          tar -C release-assets -czf "release-assets/${local_name}.tar.gz" "${local_name}"
          rm -rf "${stage}"
          ls -lh release-assets/
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-arm64-gui
          path: release-assets/*.tar.gz

  gui-windows-x86_64:
    name: Windows x86_64 (C++20 Direct2D/Acrylic GUI + Core DLL)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build, Smoke-Test & Zip Windows x86_64 GUI Bundle
        shell: pwsh
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          if (-not (Get-Command gcc -ErrorAction SilentlyContinue)) {
            $env:PATH = "C:\msys64\mingw64\bin;$env:PATH"
          }
          .\apps\windows\build_windows.ps1
          & .\dist\windows\OpenFIR.exe --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $zipName = "openfir-gui_$($env:VERSION)_windows_amd64.zip"
          Compress-Archive -Path dist\windows\* -DestinationPath "release-assets\$zipName" -Force
          Get-ChildItem release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-amd64-gui
          path: release-assets/*.zip

  gui-apple:
    name: Apple macOS Universal (.app) & iOS 15+ (.ipa) + XCFramework
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build Universal OpenFIRCore.xcframework, macOS .app & iOS .ipa
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -e
          chmod +x scripts/build_apple_core.sh
          ./scripts/build_apple_core.sh
          (cd apps/apple && xcodegen generate)

          xcodebuild \
            -project apps/apple/OpenFIRApple.xcodeproj \
            -scheme OpenFIRMac \
            -configuration Release \
            -sdk macosx \
            -derivedDataPath dist/apple/DerivedMac \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

          xcodebuild \
            -project apps/apple/OpenFIRApple.xcodeproj \
            -scheme OpenFIRiOS \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath dist/apple/DerivedIOS \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

          mkdir -p "${GITHUB_WORKSPACE}/release-assets" dist/apple/Payload
          (cd dist/apple/DerivedMac/Build/Products/Release && zip -qr "${GITHUB_WORKSPACE}/release-assets/openfir-gui_${VERSION}_macos_universal.zip" OpenFIR.app)
          cp -R dist/apple/DerivedIOS/Build/Products/Release-iphoneos/OpenFIR.app dist/apple/Payload/
          (cd dist/apple && zip -qr "${GITHUB_WORKSPACE}/release-assets/openfir-gui_${VERSION}_ios_arm64_unsigned.ipa" Payload)
          (cd dist/apple && zip -qr "${GITHUB_WORKSPACE}/release-assets/OpenFIRCore_${VERSION}.xcframework.zip" OpenFIRCore.xcframework)
          ls -lh "${GITHUB_WORKSPACE}/release-assets/"
      - uses: actions/upload-artifact@v4
        with:
          name: release-apple-guis
          path: release-assets/

  gui-android:
    name: Android 8–15+ Zero-AndroidX APK (arm64-v8a + x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build & Verify Android Frosted-Glass APK
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT}}"
          chmod +x scripts/build_android_core.sh
          ./scripts/build_android_core.sh
          gradle --no-daemon -p apps/android assembleDebug
          mkdir -p release-assets /tmp/apk_verify
          APK="release-assets/openfir-gui_${VERSION}_android_universal.apk"
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk "${APK}"
          unzip -qo "${APK}" 'lib/arm64-v8a/*.so' -d /tmp/apk_verify
          readelf -d /tmp/apk_verify/lib/arm64-v8a/libopenfir_core.so | grep 'SONAME' | grep 'libopenfir_core.so'
          readelf -d /tmp/apk_verify/lib/arm64-v8a/libopenfir_jni.so | grep 'NEEDED' | grep '\[libopenfir_core.so\]'
          ls -lh release-assets/
      - uses: actions/upload-artifact@v4
        with:
          name: release-android-apk
          path: release-assets/*.apk

  publish-release:
    name: Generate Unified SHA256SUMS & Publish GitHub Release
    needs: [cli-matrix, gui-linux-x86_64, gui-linux-arm64, gui-windows-x86_64, gui-apple, gui-android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: all-assets
          merge-multiple: true
      - name: Generate Unified SHA256SUMS.txt
        run: |
          cd all-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -lh
      - name: Publish GitHub Release with All CLI + 6-Platform GUI/TUI Assets
        uses: softprops/action-gh-release@v2
        with:
          name: "OpenFIR ${{ github.ref_name }} — All-Platform Native Frosted-Glass Suite & Hybrid CLI"
          body_path: RELEASE_NOTES_v2.0.0.md
          files: all-assets/*
          generate_release_notes: false
