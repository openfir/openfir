name: Build and Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Cross-Compile & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run Unit Tests & Vet
        run: |
          go vet ./...
          go test -v -count=1 ./...

      - name: Run Automated Chaos Self-Test
        run: go run openfir.go -mode selftest

      - name: Cross-Compile Static Binaries for All Platforms
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/openfir-linux-amd64 openfir.go
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/openfir-linux-arm64 openfir.go
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/openfir-windows-amd64.exe openfir.go
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/openfir-windows-arm64.exe openfir.go
          CGO_ENABLED=0 GOOS=darwin  GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/openfir-darwin-amd64 openfir.go
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/openfir-darwin-arm64 openfir.go
          cd dist
          sha256sum openfir-* > SHA256SUMS.txt

      - name: Attach Binaries to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/openfir-*
            dist/SHA256SUMS.txt
          generate_release_notes: true
