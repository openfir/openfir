name: Publish OpenFIR test image

on:
  push:
    branches: [test]
    paths: [.github/workflows/publish-test-image.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/smileawei/openfir:test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push both Linux architectures
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE }}
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Verify published manifest and pull both images
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE" | tee /tmp/openfir-manifest
          awk -v digest="$DIGEST" '$1 == "Digest:" && $2 == digest { found = 1 } END { exit !found }' /tmp/openfir-manifest
          docker buildx imagetools inspect --raw "$IMAGE" |
            jq -e '([.manifests[].platform | select(.os == "linux") | .architecture] | unique) == ["amd64","arm64"]'
          for arch in amd64 arm64; do
            docker pull --platform "linux/$arch" "$IMAGE@$DIGEST"
          done
          echo "Verified \`$IMAGE@$DIGEST\` for linux/amd64 and linux/arm64." >> "$GITHUB_STEP_SUMMARY"
