# SPDX-License-Identifier: Apache-2.0
name: OpenFIRApple
options:
  bundleIdPrefix: io.openfir
  deploymentTarget:
    macOS: "13.0"
    iOS: "15.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  OpenFIRMac:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Shared
      - path: macOS
    info:
      path: macOS/Info.plist
    settings:
      base:
        PRODUCT_NAME: OpenFIR
        PRODUCT_BUNDLE_IDENTIFIER: io.openfir.macos
        OTHER_LDFLAGS: "$(inherited) -lresolv"
    dependencies:
      - framework: ../../dist/apple/OpenFIRCore.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: CoreFoundation.framework
      - sdk: AppKit.framework

  OpenFIRiOS:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Shared
      - path: iOS
    info:
      path: iOS/Info.plist
    settings:
      base:
        PRODUCT_NAME: OpenFIR
        PRODUCT_BUNDLE_IDENTIFIER: io.openfir.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        OTHER_LDFLAGS: "$(inherited) -lresolv"
    dependencies:
      - framework: ../../dist/apple/OpenFIRCore.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: CoreFoundation.framework
      - sdk: UIKit.framework
